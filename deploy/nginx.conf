# Yantresh portfolio — static serving, hardened.
# Server-level config only; nginx.conf base comes from the
# unprivileged image (worker user 101, pid/cache in /tmp).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Astro emits 404.html for unmatched routes (src/pages/404.astro);
    # preserve the 404 status code while serving that page's content.
    error_page 404 /404.html;

    # ---------- compression ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;

    # ---------- caching ----------
    # Astro emits content-hashed assets under /_astro/ — cache forever.
    location /_astro/ {
        include conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(svg|ico|woff2?)$ {
        include conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # HTML revalidates on every request. Static multi-page site — no
    # SPA fallback: unmatched paths fall through to the 404 page above
    # rather than serving index.html with a 200.
    location / {
        include conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # container healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # never serve dotfiles
    location ~ /\. {
        deny all;
    }
}
