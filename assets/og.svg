<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="thread" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ee6a8"/>
      <stop offset="1" stop-color="#4cc3ff"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#4cc3ff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0a0e14"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- threads -->
  <path d="M -20 520 C 200 520 260 330 470 330 S 760 470 980 420 S 1150 250 1240 260"
        stroke="url(#thread)" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M -20 580 C 260 575 300 430 540 430 S 860 560 1240 480"
        stroke="url(#thread)" stroke-width="1.5" fill="none" opacity="0.25"/>
  <circle cx="470" cy="330" r="7" fill="#0a0e14" stroke="#2ee6a8" stroke-width="3"/>
  <circle cx="980" cy="420" r="6" fill="#4cc3ff"/>
  <circle cx="540" cy="430" r="5" fill="#2ee6a8"/>

  <!-- status pill -->
  <rect x="92" y="96" rx="17" width="430" height="34" fill="none" stroke="#2ee6a8" stroke-opacity="0.45"/>
  <circle cx="116" cy="113" r="5" fill="#2ee6a8"/>
  <text x="134" y="118" font-family="monospace" font-size="16" letter-spacing="3" fill="#2ee6a8">FULL-STACK · n8n CERTIFIED PRO</text>

  <!-- headline -->
  <text x="90" y="225" font-family="sans-serif" font-size="86" font-weight="700" fill="#e8eef9">Yash Patel</text>
  <text x="90" y="295" font-family="sans-serif" font-size="40" font-weight="600" fill="url(#thread)">the holder of threads</text>
  <text x="92" y="345" font-family="monospace" font-size="21" fill="#98a6bc">AI orchestration · distributed data engines · bounded agent systems</text>

  <!-- metric chips -->
  <g font-family="monospace" font-size="19">
    <rect x="92" y="402" rx="10" width="232" height="46" fill="#0e141f" stroke="#2d3c55"/>
    <text x="112" y="431"><tspan fill="#2ee6a8" font-weight="700">1M+</tspan><tspan fill="#98a6bc"> products tracked</tspan></text>
    <rect x="344" y="402" rx="10" width="216" height="46" fill="#0e141f" stroke="#2d3c55"/>
    <text x="364" y="431"><tspan fill="#4cc3ff" font-weight="700">300+</tspan><tspan fill="#98a6bc"> stores scraped</tspan></text>
    <rect x="580" y="402" rx="10" width="250" height="46" fill="#0e141f" stroke="#2d3c55"/>
    <text x="600" y="431"><tspan fill="#2ee6a8" font-weight="700">&lt;100ms</tspan><tspan fill="#98a6bc"> search @ scale</tspan></text>
  </g>

  <!-- footer -->
  <text x="92" y="560" font-family="monospace" font-size="17" fill="#5f6c81">yantresh — every section a node, every skill a thread</text>
</svg>
